<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Voice World</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #09090f;
    color: white;
    min-height: 100vh;
}

header {
    padding: 22px;
    text-align: center;
    background: #151520;
    border-bottom: 1px solid #29293a;
}

header h1 {
    font-size: 28px;
}

header p {
    color: #aaa;
    margin-top: 7px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 18px;
}

.welcome {
    text-align: center;
    margin-bottom: 25px;
}

.welcome h2 {
    margin-bottom: 8px;
}

.welcome p {
    color: #999;
}

.characters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 18px;
}

.character {
    background: #171722;
    border: 1px solid #29293a;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
}

.avatar {
    width: 100px;
    height: 100px;
    margin: auto;
    border-radius: 50%;
    background: #29293a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.character h3 {
    margin-top: 15px;
}

.character p {
    color: #999;
    font-size: 14px;
    margin-top: 6px;
}

.chat-btn {
    margin-top: 15px;
    padding: 10px 22px;
    border: none;
    border-radius: 22px;
    background: #7c4dff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.chat-btn:hover {
    background: #956eff;
}

/* CHAT */

#chatScreen {
    display: none;
    height: 100vh;
    flex-direction: column;
}

.chat-header {
    padding: 16px;
    background: #151520;
    border-bottom: 1px solid #29293a;
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-btn {
    background: #29293a;
    color: white;
    border: none;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
}

.chat-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #29293a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.chat-name {
    font-weight: bold;
}

.chat-status {
    color: #7cff9b;
    font-size: 12px;
    margin-top: 3px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 80%;
    padding: 12px 15px;
    border-radius: 16px;
    line-height: 1.4;
}

.bot {
    align-self: flex-start;
    background: #20202d;
}

.user {
    align-self: flex-end;
    background: #6741d9;
}

.input-area {
    padding: 12px;
    background: #151520;
    display: flex;
    gap: 8px;
}

.input-area input {
    flex: 1;
    padding: 13px;
    border-radius: 22px;
    border: 1px solid #35354a;
    background: #0d0d14;
    color: white;
    outline: none;
}

.send-btn {
    width: 48px;
    border: none;
    border-radius: 50%;
    background: #7c4dff;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- HOME -->

<div id="homeScreen">

<header>
    <h1>🌸 Anime Voice World</h1>
    <p>Chat • Talk • Create • Imagine</p>
</header>

<div class="container">

<div class="welcome">
    <h2>Choose your character</h2>
    <p>Start your conversation</p>
</div>

<div class="characters">

<div class="character">
    <div class="avatar">⚔️</div>
    <h3>Yuriko</h3>
    <p>Calm • Friendly • Samurai</p>
    <button class="chat-btn"
        onclick="openChat('Yuriko','⚔️')">
        Chat
    </button>
</div>

<div class="character">
    <div class="avatar">🔥</div>
    <h3>Akira</h3>
    <p>Energetic • Brave • Adventurer</p>
    <button class="chat-btn"
        onclick="openChat('Akira','🔥')">
        Chat
    </button>
</div>

<div class="character">
    <div class="avatar">🌙</div>
    <h3>Hana</h3>
    <p>Kind • Mysterious • Magical</p>
    <button class="chat-btn"
        onclick="openChat('Hana','🌙')">
        Chat
    </button>
</div>

</div>
</div>
</div>


<!-- CHAT -->

<div id="chatScreen">

<div class="chat-header">

<button class="back-btn" onclick="goHome()">
    ←
</button>

<div class="chat-avatar" id="chatAvatar">⚔️</div>

<div>
    <div class="chat-name" id="chatName">Yuriko</div>
    <div class="chat-status">● Online</div>
</div>

</div>

<div class="messages" id="messages"></div>

<div class="input-area">

<input
    id="messageInput"
    type="text"
    placeholder="Message your character..."
    onkeydown="handleEnter(event)"
>

<button class="send-btn" onclick="sendMessage()">
    ➤
</button>

</div>

</div>


<script>

let currentCharacter = "";

const personalities = {
    Yuriko: "Stay calm and friendly. You are a samurai named Yuriko.",
    Akira: "Be energetic, brave and adventurous. You are an adventurer named Akira.",
    Hana: "Be kind, mysterious and magical. You are Hana."
};

function openChat(name, emoji) {

    currentCharacter = name;

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "flex";

    document.getElementById("chatName").textContent = name;
    document.getElementById("chatAvatar").textContent = emoji;

    const messages = document.getElementById("messages");
    messages.innerHTML = "";

    addMessage(
        "bot",
        "Hello! I'm " + name + ". 😊 What would you like to talk about?"
    );

    document.getElementById("messageInput").focus();
}

function goHome() {

    document.getElementById("chatScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";
}

function addMessage(type, text) {

    const messages = document.getElementById("messages");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (!text) return;

    addMessage("user", text);

    input.value = "";

    setTimeout(function() {

        let reply;

        if (currentCharacter === "Yuriko") {
            reply = "Hmm... I understand. Tell me more. ⚔️";
        }

        else if (currentCharacter === "Akira") {
            reply = "That sounds awesome! 🔥 What should we do next?";
        }

        else {
            reply = "Interesting... ✨ Perhaps there is more to this story.";
        }

        addMessage("bot", reply);

    }, 700);
}

function handleEnter(event) {

    if (event.key === "Enter") {
        sendMessage();
    }
}

</script>

</body>
</html>

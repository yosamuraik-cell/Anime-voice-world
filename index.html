<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Voice World</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: white;
    min-height: 100vh;
}

/* HEADER */

header {
    text-align: center;
    padding: 25px 15px;
    background: #15131f;
    border-bottom: 1px solid #292637;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: #aaa;
    font-size: 17px;
}

/* HOME */

#home {
    padding: 40px 20px;
}

#home h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 35px;
}

.characters {
    max-width: 900px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));

    gap: 25px;
}

/* CHARACTER CARD */

.card {
    background: #181722;
    border: 1px solid #302d40;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #8b45ff;
}

.avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #29273c;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 65px;
}

.card h3 {
    font-size: 24px;
    margin-bottom: 10px;
}

.card p {
    color: #aaa;
    margin-bottom: 20px;
}

/* BUTTON */

.chat-btn {
    border: none;

    background: linear-gradient(
        135deg,
        #8b45ff,
        #6b2cff
    );

    color: white;

    padding: 13px 28px;

    border-radius: 30px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.chat-btn:active {
    transform: scale(0.95);
}

/* CHAT */

#chat {
    display: none;

    min-height: calc(100vh - 100px);

    flex-direction: column;
}

.chat-header {
    background: #15131f;

    padding: 15px;

    display: flex;
    align-items: center;

    gap: 15px;

    border-bottom: 1px solid #292637;
}

.back-btn {
    border: none;
    background: #29273c;

    color: white;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    font-size: 22px;

    cursor: pointer;
}

.chat-character {
    display: flex;
    align-items: center;
    gap: 10px;
}

.small-avatar {
    width: 45px;
    height: 45px;

    background: #29273c;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
}

.chat-character h3 {
    font-size: 19px;
}

.chat-character p {
    color: #999;
    font-size: 13px;
}

/* MESSAGES */

.messages {
    flex: 1;

    padding: 20px;

    max-width: 850px;
    width: 100%;

    margin: auto;

    overflow-y: auto;
}

.message {
    max-width: 80%;

    padding: 13px 16px;

    margin-bottom: 15px;

    border-radius: 18px;

    line-height: 1.4;
}

.message.bot {
    background: #211f30;

    border-bottom-left-radius: 5px;

    margin-right: auto;
}

.message.user {
    background: #7135df;

    border-bottom-right-radius: 5px;

    margin-left: auto;
}

/* INPUT */

.input-area {
    width: 100%;

    background: #15131f;

    border-top: 1px solid #292637;

    padding: 12px;

    display: flex;

    gap: 8px;

    position: sticky;
    bottom: 0;
}

#messageInput {
    flex: 1;

    background: #242230;

    border: 1px solid #39354b;

    color: white;

    outline: none;

    border-radius: 25px;

    padding: 13px 17px;

    font-size: 16px;
}

.send-btn,
.voice-btn {

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #7d3cff;

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.voice-btn {
    background: #29273c;
}

.send-btn:active,
.voice-btn:active {
    transform: scale(0.9);
}

/* RESPONSIVE */

@media(max-width:600px) {

    header h1 {
        font-size: 25px;
    }

    #home {
        padding: 30px 15px;
    }

    .characters {
        grid-template-columns: 1fr;
    }

    .message {
        max-width: 88%;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<header>

    <h1>🌸 Anime Voice World</h1>

    <p>Chat • Talk • Create • Imagine</p>

</header>


<!-- HOME SCREEN -->

<section id="home">

    <h2>Choose your character</h2>

    <p class="subtitle">
        Start a conversation with an AI character.
    </p>


    <div class="characters">


        <!-- YURIKO -->

        <div class="card">

            <div class="avatar">
                ⚔️
            </div>

            <h3>Yuriko</h3>

            <p>
                Calm • Friendly • Samurai
            </p>

            <button
                class="chat-btn"
                onclick="openChat('Yuriko')">

                Chat

            </button>

        </div>


        <!-- AKIRA -->

        <div class="card">

            <div class="avatar">
                🔥
            </div>

            <h3>Akira</h3>

            <p>
                Energetic • Brave • Adventurer
            </p>

            <button
                class="chat-btn"
                onclick="openChat('Akira')">

                Chat

            </button>

        </div>


        <!-- HANA -->

        <div class="card">

            <div class="avatar">
                🌙
            </div>

            <h3>Hana</h3>

            <p>
                Kind • Mysterious • Magical
            </p>

            <button
                class="chat-btn"
                onclick="openChat('Hana')">

                Chat

            </button>

        </div>


    </div>

</section>



<!-- CHAT SCREEN -->

<section id="chat">

    <div class="chat-header">

        <button
            class="back-btn"
            onclick="goHome()">

            ←

        </button>


        <div class="chat-character">

            <div
                class="small-avatar"
                id="chatAvatar">

                ⚔️

            </div>


            <div>

                <h3 id="chatName">
                    Yuriko
                </h3>

                <p>
                    AI Character
                </p>

            </div>

        </div>

    </div>



    <!-- MESSAGES -->

    <div
        class="messages"
        id="messages">

    </div>



    <!-- INPUT -->

    <div class="input-area">

        <button
            class="voice-btn"
            onclick="speakLastMessage()">

            🔊

        </button>


        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >


        <button
            class="send-btn"
            onclick="sendMessage()">

            ➤

        </button>

    </div>

</section>



<script>

/* =========================
   CHARACTER DATA
========================= */

const characterData = {

    Yuriko: {

        icon: "⚔️",

        greeting:
        "Hello! 👋 I'm Yuriko. What would you like to talk about?",

        replies: [

            "Interesting! Tell me more. ⚔️",

            "I understand. Let's continue our conversation.",

            "That's an interesting question!",

            "Hmm... let me think about that.",

            "I'm listening. What happens next?"

        ]

    },


    Akira: {

        icon: "🔥",

        greeting:
        "Yo! 🔥 I'm Akira! Ready for an adventure?",

        replies: [

            "That's awesome! 🔥",

            "Haha! Let's go!",

            "Interesting! Tell me everything!",

            "Now THAT sounds exciting!",

            "I'm ready! What's next?"

        ]

    },


    Hana: {

        icon: "🌙",

        greeting:
        "Hello... 🌙 I'm Hana. It's nice to meet you.",

        replies: [

            "That sounds wonderful. 🌙",

            "Tell me more about that.",

            "Hmm... that's interesting.",

            "I wonder what happens next...",

            "I'm listening. Take your time."

        ]

    }

};


/* =========================
   CURRENT CHARACTER
========================= */

let currentCharacter = "Yuriko";


/* =========================
   OPEN CHAT
========================= */

function openChat(character) {

    currentCharacter = character;

    const data = characterData[character];

    document.getElementById("home").style.display = "none";

    document.getElementById("chat").style.display = "flex";

    document.getElementById("chatName").textContent = character;

    document.getElementById("chatAvatar").textContent = data.icon;

    const messages =
        document.getElementById("messages");

    messages.innerHTML = "";

    addMessage(data.greeting, "bot");

}


/* =========================
   GO HOME
========================= */

function goHome() {

    document.getElementById("chat").style.display = "none";

    document.getElementById("home").style.display = "block";

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();


    if (text === "") {

        return;

    }


    /* USER MESSAGE */

    addMessage(text, "user");


    input.value = "";


    /* CHARACTER REPLY */

    setTimeout(function() {

        const data =
            characterData[currentCharacter];

        const replies =
            data.replies;

        const randomReply =
            replies[
                Math.floor(
                    Math.random() * replies.length
                )
            ];

        addMessage(randomReply, "bot");

    }, 600);

}


/* =========================
   ENTER KEY
========================= */

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    });


/* =========================
   TEXT TO SPEECH
========================= */

function speakLastMessage() {

    const messages =
        document.querySelectorAll(".message.bot");


    if (messages.length === 0) {

        return;

    }


    const last =
        messages[messages.length - 1];


    const text =
        last.textContent;


    if (!("speechSynthesis" in window)) {

        alert(
            "Voice is not supported by this browser."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.rate = 1;

    speech.pitch = 1.1;

    speech.volume = 1;


    window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
